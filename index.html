<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匹克球接龍</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 22px; margin: 8px 0; }
        label { display: block; margin: 12px 0 4px; font-size: 14px; color: #555; }
        input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px;
                        border: 1px solid #ccc; border-radius: 8px; }
        button { display: block; width: 100%; padding: 14px; margin: 12px 0; font-size: 16px;
                 border: 0; border-radius: 8px; background: #06C755; color: #fff; }
        button.secondary { background: #fff; color: #06C755; border: 1px solid #06C755; }
        button.danger { background: #fff; color: #e5484d; border: 1px solid #e5484d; }
        button:disabled { opacity: .5; }
        .info { color: #666; font-size: 14px; }
        .head { font-weight: bold; margin-top: 16px; }
        .ok { color: #1DB446; }
        .wait { color: #FF8C00; }
        ol { margin: 6px 0; padding-left: 24px; }
        li.me { font-weight: bold; }
        #myState { background: #f3f8f4; padding: 10px; border-radius: 8px; margin-top: 16px; }
        #status { color: #666; text-align: center; min-height: 1.2em; }
    </style>
</head>
<body>
    <!-- 開團表單：沒有 ?e= 參數時顯示 -->
    <section id="createView" hidden>
        <h1>🏓 發起匹克球接龍</h1>
        <form id="createForm">
            <label for="fTitle">活動名稱</label>
            <input id="fTitle" required maxlength="40" placeholder="週日進攻練習團">
            <label for="fDate">日期</label>
            <input id="fDate" required maxlength="30" placeholder="11/22（日）">
            <label for="fTime">時間</label>
            <input id="fTime" required maxlength="30" placeholder="09:00 - 12:00">
            <label for="fPlace">地點</label>
            <input id="fPlace" required maxlength="40" placeholder="六甲頂匹克球場">
            <label for="fCapacity">人數上限</label>
            <input id="fCapacity" type="number" required min="1" max="200" value="12">
            <button id="createBtn" type="submit">建立並發送到群組</button>
        </form>
    </section>

    <!-- 報名頁：有 ?e=<接龍ID> 時顯示 -->
    <section id="chainView" hidden>
        <h1 id="cTitle"></h1>
        <div id="cInfo" class="info"></div>

        <div id="myState"></div>
        <label for="guests">同行人數</label>
        <select id="guests"></select>
        <button id="joinBtn">我要報名</button>
        <button id="cancelBtn" class="danger" hidden>取消報名</button>

        <div id="cConfirmedHead" class="head ok"></div>
        <ol id="cConfirmed"></ol>
        <div id="cWaitHead" class="head wait" hidden></div>
        <ol id="cWait"></ol>

        <button id="shareListBtn" class="secondary">分享名單</button>
    </section>

    <p id="status">載入中…</p>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
